serverAddr = "tunnel-server"
serverPort = 7000

transport.tls.enable = true
transport.tls.certFile = "/app/configs/frp-tls/client.crt"
transport.tls.keyFile = "/app/configs/frp-tls/client.key"
transport.tls.trustedCaFile = "/app/configs/frp-tls/ca.crt"

[[proxies]]
name = "siffle"
type = "tcp"
localIP = "test-server"
localPort = 5678
remotePort = 9000

[[proxies]]
name = "nginx"
type = "tcp"
localIP = "test-server"
localPort = 80
remotePort = 9001

[[proxies]]
name = "iperf3"
type = "tcp"
localIP = "test-server"
localPort = 5201
remotePort = 9002

[[proxies]]
name = "tcp_echo"
type = "tcp"
localIP = "test-server"
localPort = 3001
remotePort = 9003
